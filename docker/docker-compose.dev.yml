# Local development override: publishes Postgres and the backend on the loopback interface only, so the
# backend can run from the IDE / mvnw against the containerized DB, or `npm run dev` can use the containerized API.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db            # DB only
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db backend    # DB + API on :8080
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  backend:
    ports:
      - "127.0.0.1:8080:8080"
